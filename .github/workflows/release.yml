name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  SPARKLE_RELEASE_URL: https://github.com/sparkle-project/Sparkle/releases/download/2.10.0/Sparkle-2.10.0.tar.xz

jobs:
  release:
    name: Build, sign, and publish release
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Determine version
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build Release (universal, ad-hoc signed)
        run: |
          xcodebuild \
            -project Remixa.xcodeproj \
            -scheme Remixa \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            SPARKLE_PUBLIC_KEY="${{ secrets.SPARKLE_PUBLIC_KEY }}" \
            build

      - name: Locate built app
        id: app
        run: |
          APP_PATH=$(find build/Build/Products/Release -maxdepth 1 -name "*.app" | head -n1)
          if [ -z "$APP_PATH" ]; then
            echo "Remixa.app not found" >&2
            exit 1
          fi
          echo "app_path=${APP_PATH}" >> "$GITHUB_OUTPUT"

      - name: Verify embedded remixa CLI
        run: |
          CLI_PATH="${{ steps.app.outputs.app_path }}/Contents/Helpers/remixa"
          if [ ! -x "$CLI_PATH" ]; then
            echo "remixa CLI not found or not executable at ${CLI_PATH}" >&2
            exit 1
          fi
          file "$CLI_PATH"

          APP_EXE="${{ steps.app.outputs.app_path }}/Contents/MacOS/Remixa"
          if [ ! -x "$APP_EXE" ]; then
            echo "Remixa app executable not found or not executable at ${APP_EXE}" >&2
            exit 1
          fi

      - name: Ad-hoc codesign
        run: |
          codesign --force --deep -s - "${{ steps.app.outputs.app_path }}"
          codesign --verify --verbose "${{ steps.app.outputs.app_path }}"
          codesign --verify --verbose "${{ steps.app.outputs.app_path }}/Contents/Helpers/remixa"

      - name: Create DMG
        run: |
          STAGING_DIR=$(mktemp -d)
          cp -R "${{ steps.app.outputs.app_path }}" "${STAGING_DIR}/Remixa.app"
          ln -s /Applications "${STAGING_DIR}/Applications"
          hdiutil create -volname "Remixa" \
            -srcfolder "${STAGING_DIR}" \
            -ov -format UDZO \
            Remixa.dmg

      - name: Download Sparkle release tools
        run: |
          curl -L -o sparkle.tar.xz "${SPARKLE_RELEASE_URL}"
          mkdir -p sparkle-tools
          tar -xf sparkle.tar.xz -C sparkle-tools
          find sparkle-tools -maxdepth 2 -type d

      - name: Locate Sparkle bin tools
        id: sparkle
        run: |
          BIN_DIR=$(dirname "$(find sparkle-tools -name 'sign_update' -type f | head -n1)")
          if [ -z "$BIN_DIR" ]; then
            echo "sign_update not found in Sparkle release archive" >&2
            exit 1
          fi
          echo "bin_dir=${BIN_DIR}" >> "$GITHUB_OUTPUT"
          chmod +x "${BIN_DIR}"/sign_update "${BIN_DIR}"/generate_appcast

      - name: Sign update and generate appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          APPCAST_DIR=$(mktemp -d)
          cp Remixa.dmg "${APPCAST_DIR}/"
          "${{ steps.sparkle.outputs.bin_dir }}/generate_appcast" \
            --ed-key-file <(echo "${SPARKLE_PRIVATE_KEY}") \
            --download-url-prefix "https://github.com/uyuk216/Remixa/releases/download/${{ steps.version.outputs.tag }}/" \
            "${APPCAST_DIR}"
          cp "${APPCAST_DIR}/appcast.xml" appcast.xml
          cat appcast.xml

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            Remixa.dmg appcast.xml \
            --title "Remixa ${{ steps.version.outputs.tag }}" \
            --generate-notes
