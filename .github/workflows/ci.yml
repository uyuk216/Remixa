name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build (Debug)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show versions
        run: |
          xcodebuild -version
          swift --version

      - name: Build
        run: |
          xcodebuild \
            -project Remixa.xcodeproj \
            -scheme Remixa \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify embedded remixa CLI
        run: |
          APP_PATH=$(find build/Build/Products/Debug -maxdepth 1 -name "*.app" | head -n1)
          if [ -z "$APP_PATH" ]; then
            echo "Remixa.app not found" >&2
            exit 1
          fi
          CLI_PATH="${APP_PATH}/Contents/Helpers/remixa"
          if [ ! -x "$CLI_PATH" ]; then
            echo "remixa CLI not found or not executable at ${CLI_PATH}" >&2
            exit 1
          fi
          file "$CLI_PATH"

          APP_EXE="${APP_PATH}/Contents/MacOS/Remixa"
          if [ ! -x "$APP_EXE" ]; then
            echo "Remixa app executable not found or not executable at ${APP_EXE}" >&2
            exit 1
          fi
